<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
  body{width:340px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow-x:hidden}
  .pill{white-space:nowrap}
  .site{font-weight:600;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions{display:flex;flex-direction:column;gap:6px}.actions .btn{justify-content:flex-start}
  .keys{display:flex;flex-wrap:wrap;gap:6px 10px}
  .foot{display:flex;justify-content:space-between}
  .link{background:none;border:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;padding:0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
  .stats div{background:var(--soft);border-radius:10px;padding:8px 4px}.stats b{display:block;font-size:18px;letter-spacing:-.02em}
  .stats span{font-size:11px;color:var(--muted)}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #pausedNote{display:none;font-size:12px}
</style></head>
<body>
  <div class="brand"><img src="icons/icon48.png" alt=""><div style="flex:1"><b>Application Tracker</b><small>assistente de candidatura</small></div></div>
  <div class="head"><span id="status" class="pill"><i></i>…</span><button class="btn sm" id="pause" title="Pausa o assistente em todos os sites por 1 hora">Pausar 1h</button></div>
  <div id="pausedNote" class="card muted"></div>

  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <label class="row"><div><b>Assistente ativo</b><div class="muted">Pausa em todos os sites quando desligado</div></div><span class="sw"><input type="checkbox" id="enabled"><span></span></span></label>
    <label class="row" id="siteRow"><div><b>Neste site</b><div class="muted site" id="host">—</div></div><span class="sw"><input type="checkbox" id="site"><span></span></span></label>
    <label class="row"><div><b>Preencher sozinho</b><div class="muted">Quando um formulário de candidatura aparece</div></div><span class="sw"><input type="checkbox" id="autoFill"><span></span></span></label>
    <label class="row"><div><b>Anexar meu CV</b><div class="muted">PDF escolhido para a vaga</div></div><span class="sw"><input type="checkbox" id="attachResume"><span></span></span></label>
  </div>

  <div class="actions">
    <button class="btn primary" id="panel">Mostrar o assistente nesta página</button>
    <div class="grid2"><button class="btn" id="fill">Preencher de novo</button><button class="btn" id="ai">✨ Completar com IA</button></div>
    <button class="btn" id="dash">Abrir o tracker</button>
  </div>

  <div class="stats" title="Contagem de hoje neste navegador">
    <div><b id="sFilled">0</b><span>campos hoje</span></div>
    <div><b id="sAi">0</b><span>com IA</span></div>
    <div><b id="sApps">0</b><span>candidaturas</span></div>
  </div>

  <div class="card"><div class="muted" style="margin-bottom:6px">Atalhos</div>
    <div class="keys muted"><span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> painel</span><span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> preencher</span><span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>I</kbd> IA</span></div>
  </div>
  <div class="foot"><button class="link" id="opts">Opções</button><button class="link" id="keys">Trocar atalhos</button></div>
<script src="defaults.js"></script><script src="popup.js"></script>
</body></html>
