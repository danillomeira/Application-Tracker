# Implantação completa (VPS ou máquina local): banco, fila, API, workers, beat e dashboard.
# IA: o Claude Code (CLI `claude`) não existe dentro dos containers. Aqui é obrigatório ANTHROPIC_API_KEY no .env.
# O currículo entra pelo onboarding do dashboard (fica no banco); não há arquivo para montar.
# Uso, na raiz do repositório: docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build
# A extensão do navegador continua na sua máquina, apontando para a API.
name: tracker-prod

x-backend: &backend
  build: { context: .., dockerfile: infra/Dockerfile.backend }
  env_file: ../.env
  environment:
    APP_ENV: prod
    DATABASE_URL: postgresql+asyncpg://tracker:${POSTGRES_PASSWORD:-tracker}@postgres:5432/tracker
    REDIS_URL: redis://redis:6379/0
    STORAGE_LOCAL_DIR: /app/data/storage
    BEAT_SCHEDULE_FILE: /app/data/storage/.celerybeat-schedule
  volumes:
    - storage:/app/data/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: tracker
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *backend
    command: ["tracker-worker"]

  beat:
    <<: *backend
    command: ["tracker-beat"]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args: { API_INTERNAL_URL: "http://api:8000" }
    ports: ["127.0.0.1:3100:3100"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pg:
  redis:
  storage:
